<h2>Create Your Account</h2>

<form action="login.html" method="get">
  <p>
    <label for="r-name">Full Name</label><br>
    <input type="text" id="r-name" name="name" required>
  </p>
  <p>
    <label for="r-email">Campus Email</label><br>
    <input type="email" id="r-email" name="email" required>
  </p>
  <p>
    <label for="r-pass">Password</label><br>
    <input type="password" id="r-pass" name="password" required>
  </p>
  <p>
    <label for="r-pass2">Confirm Password</label><br>
    <input type="password" id="r-pass2" name="password2" required>
  </p>
  <p>
    <input type="checkbox" id="r-terms" name="terms" required>
    <label for="r-terms">I agree to the Terms &amp; Privacy Policy</label>
  </p>
  <p><input type="submit" value="Create Account"></p>
</form>

<p>Already have an account? <a href="login.html">Log in</a></p>
