<h2>Get in Touch</h2>
<p>Bug report, question — send us a message.</p>

<form action="#" method="post">
  <p>
    <label for="c-name">Full Name</label><br>
    <input type="text" id="c-name" name="name" required>
  </p>
  <p>
    <label for="c-email">Email</label><br>
    <input type="email" id="c-email" name="email" required>
  </p>
  <p>
    <label for="c-subject">Subject</label><br>
    <input type="text" id="c-subject" name="subject" required>
  </p>
  <p>
    <label for="c-msg">Message</label><br>
    <textarea id="c-msg" name="message" rows="5" cols="40" required></textarea>
  </p>
  <p><input type="submit" value="Send Message"></p>
</form>
