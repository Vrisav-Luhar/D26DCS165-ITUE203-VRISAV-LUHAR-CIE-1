<h2>Log In to Your Account</h2>

<form action="student-dashboard.html" method="get">
  <p>
    <label for="l-email">Email</label><br>
    <input type="email" id="l-email" name="email" required>
  </p>
  <p>
    <label for="l-pass">Password</label><br>
    <input type="password" id="l-pass" name="password" required>
  </p>
  <p>
    <input type="checkbox" id="l-remember" name="remember">
    <label for="l-remember">Remember me</label>
  </p>
  <p><a href="#">Forgot password?</a></p>
  <p><input type="submit" value="Log In"></p>
</form>

<p>New here? <a href="register.html">Create an account</a></p>
